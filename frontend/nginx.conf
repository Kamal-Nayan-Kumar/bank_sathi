server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames, so they can be cached indefinitely.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The entry document must never be cached, or a deploy leaves clients running
  # old JS against a new API.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Single-page app: unknown paths are client-side routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
}
