# Render blueprint for the Card Sathi backend (FastAPI + LangGraph).
#
# Deploy with:  render blueprint launch
#   or: New > Blueprint, point at this repo's render.yaml
#
# Everything the app needs is in .env.example. Only credentials are required;
# the app boots on SQLite with local fallbacks if the optional ones are absent.

services:
  - type: web
    name: card-sathi-api
    runtime: python
    plan: free
    region: singapore # closest to Neon and to the audience
    rootDir: .
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    # The free plan sleeps after inactivity, so a cold start pays for the
    # MiniLM model load. The lifespan hook warms it at boot; this just gives the
    # health check time to see a ready process rather than a loading one.
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Keep the runtime lean: the free tier has 512MB and the embedding model
      # is the hungriest thing in the process.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: LOG_LEVEL
        value: WARNING

      # --- Groq (primary LLM). Optional: falls back to template prose. ---
      - key: GROQ_API_KEY
        sync: false

      # --- OpenRouter (fallback LLM). Optional but recommended: Groq's free
      #     tier rate-limits hard and this is what stops a 429 becoming a
      #     30-second wait. ---
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL_EXTRACT
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_MODEL_EXPLAIN
        value: nvidia/nemotron-3-super-120b-a12b:free

      # --- Neon. Optional: falls back to SQLite in data/. ---
      - key: DATABASE_URL
        sync: false

      # --- Qdrant. Optional: falls back to an in-process store, which means
      #     the corpus is re-ingested on every cold start (about 2s). ---
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
